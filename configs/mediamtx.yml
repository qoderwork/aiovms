# MediaMTX v1.20.0 配置
# API 默认关闭，需显式开启（默认端口 9997）
api: yes
# 内部网络调用，允许所有 IP 无密码访问 API
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: publish
      - action: read
      - action: api
      - action: metrics
# 录像存储到 /recordings，按 路径名/日期 分层
# recordSegmentDuration: 每 1 分钟切一个分片
# 注意：cam-* 路径由 aiovms 通过 API 动态下发（含 recordPath、分片时长和
# runOnRecordSegmentComplete 回调），显式 add 的命名路径不会继承下面的
# all_others 配置，此处仅作为其他路径的默认值。
paths:
  all_others:
    record: false
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
    recordSegmentDuration: 1m
    recordFormat: fmp4
