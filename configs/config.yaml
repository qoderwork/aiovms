server:
  port: 8081

database:
  host: mysql
  port: 3306
  user: root
  password: root123456
  dbname: swnms
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 50
  log_level: info

mediamtx:
  url: "http://aiovms-mediamtx:9997"

recording:
  path: "/recordings"
  retention_days: 3
  disk_watermark: 80
  # MediaMTX 录像分片时长，显式下发给 cam-* 路径（不依赖 all_others 继承）
  segment_duration: "1m"

logger:
  filename: "logs/aiovms.log"
  level: "info"
  max_size_mb: 50
  max_backups: 3
  retention_days: 7
  compress: true
  stdout: true
