server:
  port: 8081

database:
  host: mysql
  port: 3306
  user: root
  # 密码优先级：vault > env(VMS_DB_PASSWORD) > 本文件。
  # 本值仅作最后兜底，是否留空取决于部署形态：
  #   - 生产强依赖 vault（推荐）：vault.enabled + vault.required=true，本值留空。
  #     vault 不可达时拒绝启动（不会走到本值），DB 密码无明文落盘。
  #   - 允许 vault/env 降级：本值必须为可用密码（明文），或依赖 VMS_DB_PASSWORD
  #     注入；两者皆缺时 DB 连接失败、启动退出（fail-fast，日志可定位）。
  # 注意：VMS_DB_PASSWORD 显式置空会被忽略（viper 默认行为），回退到本值。
  password: ""
  dbname: base_station
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 50
  log_level: info

# Vault 集成（可选）：enabled=true 时启动期从 Vault 读取敏感配置覆盖 config.yaml
# token/addr 支持环境变量 VAULT_TOKEN / VAULT_ADDR 覆盖
# vault 不可达时：required=false 自动回退到 config.yaml；required=true 拒绝启动
# vault 中需写入的 key：
#   database.password  → 覆盖 database.password
#   encryption.key     → 覆盖 VMS_ENCRYPTION_KEY 环境变量（≥32字节）
vault:
  enabled: true              # 生产环境设为 true
  required: false             # true=vault 不可达时拒绝启动（生产推荐）
  addr: "https://vault:8200" # 或通过 VAULT_ADDR 环境变量
  token: ""                  # 通过 VAULT_TOKEN 环境变量注入
  path: "secret/data/vms"    # KV v2 路径；KV v1 用 "secret/vms"
  kv_version: 2              # 1 或 2，显式声明避免探测歧义
  ca_base64: ""              # HTTPS 自签证书的 CA PEM（base64），留空走系统证书池
  insecure: true            # 跳过 TLS 校验（仅开发环境）
  timeout_sec: 10            # HTTP 超时（秒）

mediamtx:
  url: "http://mediamtx:9997"

recording:
  path: "/recordings"
  retention_days: 3
  disk_watermark: 80
  # MediaMTX 录像分片时长，显式下发给 cam-* 路径（不依赖 all_others 继承）
  segment_duration: "1m"
  # 分片完成回调（快路径）：MediaMTX 写完分片后 POST 回 aiovms 立即入库。
  # 该地址必须是从 mediamtx 容器视角可达的 aiovms 地址（compose 服务名）。
  # 留空则禁用 hook，仅靠磁盘扫描兜底。
  hook_base_url: "http://aiovms:8081"
  # 磁盘扫描间隔（慢路径兜底）。hook 启用后可放宽到 5 分钟。
  scan_interval_sec: 300

logger:
  filename: "logs/aiovms.log"
  level: "info"
  max_size_mb: 50
  max_backups: 3
  retention_days: 7
  compress: true
  stdout: true
