# AIO VMS 本地开发环境
# 启动: docker compose up -d
# 停止: docker compose down
# 注意: 使用 Bind Mount 挂载数据目录，启动前需创建 ./data、./logs 目录
services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: aiovms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: swnms
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MediaMTX 流媒体服务器
  mediamtx:
    #image: bluenviron/mediamtx:1.20.0
    image: bluenviron/mediamtx:1.20.0-ffmpeg
    container_name: aiovms-mediamtx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "1935:1935"   # RTMP
      - "9997:9997"   # HTTP API
    volumes:
      - ./data/mediamtx-recordings:/recordings
      - ./configs/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- http://127.0.0.1:9997/v3/config/global/get > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # VMS 后端服务
  aiovms:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: aiovms:latest
    container_name: aiovms-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      VMS_ENCRYPTION_KEY: "e587e6f46b4dd28a58a8367c8f90d424"  # 生产环境需替换为强密钥
      # Vault 集成（可选）：通过环境变量注入 token/addr，覆盖 config.yaml 中的值
      # VAULT_TOKEN: ${VAULT_TOKEN}
      # VAULT_ADDR: "https://vault:8200"
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/logs
      - ./data/mediamtx-recordings:/recordings
      - ./configs/config.yaml:/etc/aiovms/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
