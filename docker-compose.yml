# AIO VMS 本地开发环境
# 启动: docker compose up -d
# 停止: docker compose down
# 注意: 使用 Bind Mount 挂载数据目录，启动前需创建 ./data、./logs 目录
services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: aiovms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: swnms
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MediaMTX 流媒体服务器
  mediamtx:
    image: bluenviron/mediamtx:v1.20.0
    container_name: aiovms-mediamtx
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MTX_PATHS_ALL_RECORDPATH: /recordings/%path/%Y-%m-%d_%H-%M-%S
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HTTP API
      - "1935:1935"   # RTMP
    volumes:
      - ./data/mediamtx-recordings:/recordings
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/v3/paths/list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # VMS 后端服务
  aiovms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiovms-server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      VMS_ENCRYPTION_KEY: "change-me-to-a-32-byte-secret!!"  # 生产环境需替换为强密钥
    ports:
      - "8081:8081"
    volumes:
      - ./logs:/logs
      - ./data/mediamtx-recordings:/recordings
      - ./configs/config.yaml:/etc/aiovms/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
